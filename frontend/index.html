    <!-- JSON-LD: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SteamStats",
      "description": "Steam IDを入力するだけで、プレイ時間TOP20チャート、ジャンル別分析、コスパランキング、フレンド比較を即座に表示できる無料のSteamプレイ時間ビジュアライザー。",
      "url": "https://steam-play-time.vercel.app/",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "JPY"
      },
      "inLanguage": ["ja", "en"],
      "keywords": "Steam,プレイ時間,統計,分析,ゲーム,チャート"
    }
    </script>

    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Steamのプレイ時間はどうやって確認できますか？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Steam IDまたはプロフィールURLを入力するだけで、全ゲームのプレイ時間を一覧表示できます。TOP20チャート、ジャンル別分析、コスパランキングなど多角的に確認できます。"
          }
        },
        {
          "@type": "Question",
          "name": "Steam IDはどこで確認できますか？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Steamクライアントのプロフィールページ、またはsteamcommunity.comのプロフィールURLから確認できます。17桁の数字（SteamID64）またはカスタムURL（steamcommunity.com/id/yourname）の形式に対応しています。"
          }
        },
        {
          "@type": "Question",
          "name": "プロフィールを公開にする必要がありますか？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "はい。Steam Web APIの仕様上、プロフィールの「ゲームの詳細」が「公開」に設定されている必要があります。Steamクライアントの設定から変更できます。"
          }
        },
        {
          "@type": "Question",
          "name": "無料で使えますか？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "はい、すべての機能を無料でご利用いただけます。アカウント登録なしでも基本分析が可能です。"
          }
        },
        {
          "@type": "Question",
          "name": "友人とプレイ時間を比較できますか？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "はい。フレンド比較機能で、2人のSteam IDを入力するだけで共通ゲームのプレイ時間を比較できます。"
          }
        },
        {
          "@type": "Question",
          "name": "データはどのくらいの頻度で更新されますか？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Steam APIからリアルタイムでデータを取得します。キャッシュは15分〜1時間で更新されるため、ほぼ最新の情報が表示されます。"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

  </body>
